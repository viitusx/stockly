
{% extends "base.html" %}

{% block content %}
<h1>Criar conta</h1>

<form method="POST">
    <input type="text" name="name" placeholder="Nome" required>

    <input type="email" name="email" placeholder="E-mail" required>

    <input type="password" name="password" placeholder="Senha (mínimo 8 caracteres)" required minlength="8">

    <button type="submit">Cadastrar</button>
</form>

<a href="{{ url_for('auth.login') }}">Já tenho uma conta</a>
{% endblock %}
