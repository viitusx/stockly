
{% extends "base.html" %}

{% block title %}Nova Categoria | Stockly{% endblock %}

{% block content %}

<h2 class="fw-bold mb-4">Nova categoria</h2>

<div class="card border-0 shadow-sm">
    <div class="card-body">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Nome da categoria</label>

                <input type="text"
                       name="name"
                       class="form-control"
                       placeholder="Ex: Eletrônicos"
                       maxlength="100"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descrição</label>

                <textarea name="description"
                          class="form-control"
                          rows="3"
                          placeholder="Descrição da categoria"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Salvar categoria
            </button>

            <a href="{{ url_for('categories.list_categories') }}"
               class="btn btn-outline-secondary">
                Cancelar
            </a>

        </form>

    </div>
</div>

{% endblock %}
