{% extends "base.html" %}

{% block title %}Novo Fornecedor | Stockly{% endblock %}

{% block content %}

<div class="mb-4">
    <h2 class="fw-bold">Novo fornecedor</h2>
    <p class="text-muted">
        Preencha os dados para cadastrar um fornecedor.
    </p>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-4">

        <form method="POST">

            <div class="mb-3">
                <label for="name" class="form-label">
                    Nome do fornecedor *
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="name"
                    name="name"
                    placeholder="Ex: Distribuidora Central"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">
                    E-mail
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="fornecedor@email.com"
                >
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">
                    Telefone
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="phone"
                    name="phone"
                    placeholder="(81) 99999-9999"
                >
            </div>

            <div class="mb-4">
                <label for="document" class="form-label">
                    CPF ou CNPJ
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="document"
                    name="document"
                    placeholder="Digite o documento"
                >
            </div>

            <div class="d-flex gap-2">

                <button type="submit" class="btn btn-primary">
                    Cadastrar fornecedor
                </button>

                <a href="{{ url_for('suppliers.list_suppliers') }}"
                   class="btn btn-outline-secondary">
                    Cancelar
                </a>

            </div>

        </form>

    </div>
</div>

{% endblock %}
